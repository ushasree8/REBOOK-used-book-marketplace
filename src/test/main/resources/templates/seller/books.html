<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>My Books</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

<div class="container">


<a class="navbar-brand">
📚 ReBook Seller
</a>



<div>


<a class="btn btn-success me-2"
th:href="@{/seller/add-book}">
Add New Book
</a>



<form th:action="@{/logout}"
method="post"
style="display:inline">


<button class="btn btn-danger">
Logout
</button>


</form>


</div>


</div>

</nav>





<div class="container mt-5">


<h2>
My Books 📚
</h2>


<hr>



<table class="table table-bordered table-striped">


<tr class="table-dark">

<th>ID</th>

<th>Image</th>

<th>Title</th>

<th>Author</th>

<th>Price</th>

<th>Condition</th>

<th>Stock</th>

<th>Action</th>

</tr>





<tr th:each="book:${books}">


<td th:text="${book.id}">
</td>




<td>


<img th:if="${book.imageName != null}"
     th:src="@{'/books/' + ${book.imageName}}"
     width="100"
     height="120">



<span th:if="${book.imageName == null}">
No Image
</span>


</td>





<td th:text="${book.title}">
</td>


<td th:text="${book.author}">
</td>


<td>
₹<span th:text="${book.price}"></span>
</td>


<td th:text="${book.bookCondition}">
</td>


<td th:text="${book.stock}">
</td>




<td>


<a class="btn btn-warning btn-sm"
th:href="@{/seller/edit/{id}(id=${book.id})}">
Edit
</a>




<a class="btn btn-danger btn-sm"
th:href="@{/seller/delete/{id}(id=${book.id})}"
onclick="return confirm('Delete this book?');">

Delete

</a>


</td>


</tr>



</table>



</div>


</body>


</html>
