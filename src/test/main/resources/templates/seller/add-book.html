<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Book | ReBook</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="book-form">

    <h2>📚 Add New Book</h2>

    <form th:action="@{/seller/save-book}"
          th:object="${book}"
          method="post"
          enctype="multipart/form-data">

        <label>Book Title</label>
        <input type="text"
               th:field="*{title}"
               placeholder="Enter book title"
               required>

        <label>Author</label>
        <input type="text"
               th:field="*{author}"
               placeholder="Enter author name"
               required>

        <label>ISBN</label>
        <input type="text"
               th:field="*{isbn}"
               placeholder="Enter ISBN">

        <label>Description</label>
        <textarea th:field="*{description}"
                  rows="5"
                  placeholder="Enter description"></textarea>

        <label>Price (₹)</label>
        <input type="number"
               step="0.01"
               th:field="*{price}"
               placeholder="Enter price"
               required>

        <label>Book Condition</label>

        <select th:field="*{bookCondition}">
            <option value="">Select Condition</option>
            <option value="Like New">Like New</option>
            <option value="Good">Good</option>
            <option value="Fair">Fair</option>
        </select>

        <label>Stock</label>
        <input type="number"
               th:field="*{stock}"
               placeholder="Available stock"
               required>

        <label>Book Image</label>
        <input type="file"
               name="imageFile"
               accept="image/*">

        <button type="submit">
            Save Book
        </button>

    </form>

</div>

</body>

</html>
