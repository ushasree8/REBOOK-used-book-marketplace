<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
</head>
<body>

<h1>Edit Book</h1>

<form th:action="@{/seller/update}" th:object="${book}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Title</label><br>
    <input type="text" th:field="*{title}"><br><br>

    <label>Author</label><br>
    <input type="text" th:field="*{author}"><br><br>

    <label>ISBN</label><br>
    <input type="text" th:field="*{isbn}"><br><br>

    <label>Description</label><br>
    <textarea th:field="*{description}"></textarea><br><br>

    <label>Price</label><br>
    <input type="number" step="0.01" th:field="*{price}"><br><br>

    <label>Condition</label><br>
    <input type="text" th:field="*{bookCondition}"><br><br>

    <label>Stock</label><br>
    <input type="number" th:field="*{stock}"><br><br>

    <button type="submit">Update Book</button>

</form>

</body>
</html>
