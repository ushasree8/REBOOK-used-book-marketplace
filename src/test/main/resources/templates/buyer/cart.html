    <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>My Cart - ReBook</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand">
ReBook Cart
</a>


<form th:action="@{/logout}" method="post" style="display:inline">

<button class="btn btn-danger"
type="submit">
Logout
</button>

</form>


</div>

</nav>




<div class="container mt-5">


<h2>
My Cart 🛒
</h2>



<table class="table table-bordered">


<thead>

<tr>

<th>Image</th>

<th>Book</th>

<th>Price</th>

<th>Quantity</th>

<th>Action</th>

</tr>

</thead>



<tbody>



<tr th:each="item : ${cartItems}">



<td>

<img th:if="${item.book.imageName != null}"
     th:src="@{/books/{image}(image=${item.book.imageName})}"
     width="80"
     height="100">


</td>




<td th:text="${item.book.title}">
Book
</td>




<td>

₹<span th:text="${item.book.price}">
</span>

</td>




<td th:text="${item.quantity}">
1
</td>




<td>


<a class="btn btn-danger"

th:href="@{/buyer/cart/remove/{id}(id=${item.id})}">

Remove

</a>


</td>



</tr>


</tbody>


</table>



<a class="btn btn-success"
   th:href="@{/buyer/address}">
    Checkout
</a>



</div>


</body>

</html>
