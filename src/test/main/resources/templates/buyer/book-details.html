<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Book Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>


<div class="container mt-5">


<div class="row">


<div class="col-md-5">


<img th:if="${book.imageName != null}"
     th:src="@{/books/{image}(image=${book.imageName})}"
     width="300"
     height="400">


<p th:if="${book.imageName == null}">
No Image Available
</p>


</div>




<div class="col-md-7">


<h1 th:text="${book.title}">
Book Name
</h1>



<h4>
Author:
<span th:text="${book.author}">
</span>
</h4>



<h3>
₹<span th:text="${book.price}">
</span>
</h3>



<p>
Condition:
<span th:text="${book.bookCondition}">
</span>
</p>



<p>
Description:
</p>


<p th:text="${book.description}">
</p>



<a class="btn btn-secondary"
th:href="@{/buyer/home}">
Back
</a>


<a class="btn btn-primary"
   th:href="@{/buyer/cart/add/{id}(id=${book.id})}">
Add To Cart 🛒
</a>



</div>


</div>


</div>


</body>

</html>
