<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>ReBook - Buyer Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
            <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/buyer/home}">
            📚 ReBook
        </a>

        <div>

            <a class="btn btn-info me-2"
               th:href="@{/buyer/orders}">
                My Orders 📦
            </a>

            <a class="btn btn-warning me-2"
               th:href="@{/buyer/cart}">
                Cart 🛒
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline;">

                <button class="btn btn-danger">
                    Logout
                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <!-- Search -->

    <form th:action="@{/buyer/home}"
          method="get"
          class="mb-4">

        <div class="input-group">

            <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    placeholder="Search by title or author...">

            <button
                    class="btn btn-primary"
                    type="submit">

                🔍 Search

            </button>

        </div>

    </form>

    <h2 class="mb-4">
        Available Books 📚
    </h2>

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="book : ${books}">

            <div class="card shadow h-100">

                <img th:if="${book.imageName != null}"
                     th:src="@{'/books/' + ${book.imageName}}"
                     class="card-img-top"
                     style="height:250px;object-fit:cover;">

                <img th:if="${book.imageName == null}"
                     src="https://via.placeholder.com/250x300?text=No+Image"
                     class="card-img-top"
                     style="height:250px;object-fit:cover;">

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${book.title}">
                        Book Title
                    </h5>

                    <p>
                        <b>Author:</b>
                        <span th:text="${book.author}"></span>
                    </p>

                    <p>
                        <b>Price:</b>
                        ₹<span th:text="${book.price}"></span>
                    </p>

                    <p>
                        <b>Condition:</b>
                        <span th:text="${book.bookCondition}"></span>
                    </p>

                    <a class="btn btn-primary"
                       th:href="@{/buyer/book/{id}(id=${book.id})}">
                        View Details
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
