<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Delivery Address</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
            <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>Delivery Address 🚚</h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/buyer/save-address}"
                          th:object="${address}"
                          method="post">

                        <div class="mb-3">
                            <label>Full Name</label>
                            <input class="form-control"
                                   type="text"
                                   th:field="*{fullName}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Phone</label>
                            <input class="form-control"
                                   type="text"
                                   th:field="*{phone}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>House / Flat No.</label>
                            <input class="form-control"
                                   type="text"
                                   th:field="*{house}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Street</label>
                            <input class="form-control"
                                   type="text"
                                   th:field="*{street}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>City</label>
                            <input class="form-control"
                                   type="text"
                                   th:field="*{city}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>State</label>
                            <input class="form-control"
                                   type="text"
                                   th:field="*{state}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Pincode</label>
                            <input class="form-control"
                                   type="text"
                                   th:field="*{pincode}"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100">
                            Continue to Payment →
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
