<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - ReBook</title>
    <meta charset="UTF-8">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h2>Register</h2>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form th:action="@{/register}" th:object="${user}" method="post">

    <input type="text" th:field="*{firstName}" placeholder="First Name" required><br><br>

    <input type="text" th:field="*{lastName}" placeholder="Last Name" required><br><br>

    <input type="email" th:field="*{email}" placeholder="Email" required><br><br>

    <input type="password" th:field="*{password}" placeholder="Password" required><br><br>

    <input type="text" th:field="*{phone}" placeholder="Phone"><br><br>

    <select th:field="*{role}">
        <option th:each="role : ${roles}"
                th:value="${role}"
                th:text="${role}">
        </option>
    </select>

    <br><br>

    <button type="submit">Register</button>

</form>

</body>
</html>
