<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
      <link rel="stylesheet" th:href="@{/css/style.css}">


<head>

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>



<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

<div class="container">


<a class="navbar-brand">
 ReBook Admin
</a>



<form th:action="@{/logout}" method="post">

<button class="btn btn-danger">

Logout

</button>

</form>



</div>

</nav>





<div class="container mt-5">



<h1>
Admin Dashboard 
</h1>

<div class="row mt-4">

    <div class="col-md-3">
        <div class="card text-bg-primary shadow">
            <div class="card-body">
                <h5>Total Users</h5>
                <h2 th:text="${totalUsers}"></h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-success shadow">
            <div class="card-body">
                <h5>Total Books</h5>
                <h2 th:text="${totalBooks}"></h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-warning shadow">
            <div class="card-body">
                <h5>Total Orders</h5>
                <h2 th:text="${totalOrders}"></h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-danger shadow">
            <div class="card-body">
                <h5>Total Payments</h5>
                <h2 th:text="${totalPayments}"></h2>
            </div>
        </div>
    </div>

</div>

<hr>


<hr>





<!-- USERS -->


<h3>
Users 👥
</h3>


<table class="table table-bordered table-striped">


<tr class="table-dark">

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Role</th>

<th>Action</th>

</tr>



<tr th:each="user:${users}">


<td th:text="${user.id}">
</td>


<td th:text="${user.firstName}">
</td>


<td th:text="${user.email}">
</td>


<td th:text="${user.role}">
</td>



<td>


<a class="btn btn-danger btn-sm"
th:href="@{/admin/user/delete/{id}(id=${user.id})}">

Delete

</a>


</td>


</tr>


</table>







<!-- BOOKS -->


<h3 class="mt-5">
Books 📚
</h3>


<table class="table table-bordered table-striped">


<tr class="table-dark">


<th>ID</th>

<th>Title</th>

<th>Price</th>

<th>Action</th>


</tr>




<tr th:each="book:${books}">


<td th:text="${book.id}">
</td>


<td th:text="${book.title}">
</td>


<td>
₹<span th:text="${book.price}"></span>
</td>



<td>


<a class="btn btn-danger btn-sm"
th:href="@{/admin/book/delete/{id}(id=${book.id})}">

Delete

</a>


</td>


</tr>


</table>








<!-- ORDERS -->


<h3 class="mt-5">
Orders 📦
</h3>



<table class="table table-bordered table-striped">


<tr class="table-dark">


<th>ID</th>

<th>Total</th>

<th>Status</th>

<th>Action</th>


</tr>




<tr th:each="order:${orders}">


<td th:text="${order.id}">
</td>


<td>

₹<span th:text="${order.totalAmount}"></span>

</td>



<td th:text="${order.status}">
</td>




<td>


<a class="btn btn-warning btn-sm me-1"
th:href="@{/admin/order/status/{id}(id=${order.id},status='CONFIRMED')}">

Confirm

</a>




<a class="btn btn-primary btn-sm me-1"
th:href="@{/admin/order/status/{id}(id=${order.id},status='SHIPPED')}">

Ship

</a>




<a class="btn btn-success btn-sm"
th:href="@{/admin/order/status/{id}(id=${order.id},status='DELIVERED')}">

Deliver

</a>


</td>


</tr>


</table>



</div>



</body>


</html>
